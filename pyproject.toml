[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-seo-mcp"
version = "0.1.0"
description = "Google Analytics 4 MCP for Claude Code & Cursor with diagnostic SEO/marketing intelligence: anomaly detection (rolling Z-score), traffic-drop classification, content decay, conversion funnel, GSC→GA4 journey, channel attribution. Read-only by default with anti-hallucination provenance metadata on every response."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mario Hernández"}]
keywords = [
    "mcp", "mcp-server", "model-context-protocol",
    "claude", "claude-code", "anthropic", "cursor",
    "google-analytics", "ga4", "google-analytics-4",
    "seo", "seo-tools", "seo-automation", "marketing-analytics",
    "anomaly-detection", "traffic-attribution",
    "fastmcp", "python", "oauth",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0",
    "google-analytics-data>=0.18.0",
    "google-analytics-admin>=0.22.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "platformdirs>=4.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.0",
]

[project.scripts]
ga4-seo-mcp = "ga4_seo_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/mario-hernandez/google-analytics-mcp-claude-code"
Repository = "https://github.com/mario-hernandez/google-analytics-mcp-claude-code"
Issues = "https://github.com/mario-hernandez/google-analytics-mcp-claude-code/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
